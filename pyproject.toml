[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "serverwatch"
version = "0.2.0"
description = "A lightweight open-source Linux system monitoring CLI."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "psutil>=7.0,<8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]

[project.scripts]
serverwatch = "serverwatch:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

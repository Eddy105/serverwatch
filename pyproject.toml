[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "serverwatch"
version = "0.2.0"
description = "A lightweight open-source Linux system monitoring CLI."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Eddy105" },
]
keywords = ["linux", "monitoring", "cli", "system", "devops"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "psutil>=7.0,<8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.12,<1",
]

[project.scripts]
serverwatch = "serverwatch:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=serverwatch --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
branch = true

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
